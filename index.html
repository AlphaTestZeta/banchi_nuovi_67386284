<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Posti</title>
    <style>
        /* Reset e Stili Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Layout Griglia */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 40px;
        }

        /* Stile dei Banchi */
        .desk {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1a1a;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            user-select: none;
        }

        .desk:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
        }

        /* Stile del Pulsante */
        .controls {
            display: flex;
            justify-content: center;
        }

        button {
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            user-select: none;
        }

        button:hover:not(:disabled) {
            background-color: #333333;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #cccccc;
            color: #888888;
            cursor: not-allowed;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
            }
            .desk {
                font-size: 1.25rem;
                border-radius: 8px;
            }
        }

        @media (max-width: 480px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="grid-container" id="grid"></div>
    
    <div class="controls">
        <button id="shuffleBtn">Genera</button>
    </div>

    <script>
        // Configurazione
        const TOTAL_SEATS = 24;
        const COOLDOWN_SECONDS = 5;

        // Stato
        let seats = Array.from({ length: TOTAL_SEATS }, (_, i) => i + 1);
        let isCooldown = false;

        // Elementi DOM
        const gridElement = document.getElementById('grid');
        const shuffleBtn = document.getElementById('shuffleBtn');

        // Funzione per mescolare l'array (Algoritmo Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Funzione per renderizzare i banchi
        function renderGrid() {
            gridElement.innerHTML = '';
            seats.forEach(number => {
                const desk = document.createElement('div');
                desk.classList.add('desk');
                desk.textContent = number;
                gridElement.appendChild(desk);
            });
        }

        // Funzione di casualizzazione con timer
        function handleShuffle() {
            if (isCooldown) return;

            // Mescola e renderizza
            seats = shuffleArray(seats);
            renderGrid();

            // Avvia il cooldown
            isCooldown = true;
            let timeLeft = COOLDOWN_SECONDS;
            
            shuffleBtn.disabled = true;
            shuffleBtn.textContent = `${timeLeft}s`;

            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    shuffleBtn.textContent = `${timeLeft}s`;
                } else {
                    clearInterval(timer);
                    isCooldown = false;
                    shuffleBtn.disabled = false;
                    shuffleBtn.textContent = 'Genera';
                }
            }, 1000);
        }

        // Inizializzazione
        renderGrid();
        shuffleBtn.addEventListener('click', handleShuffle);
    </script>
</body>
</html>
