<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Posti - LIM Orizzontale Forzato</title>
    <style>
        /* Reset e Stili Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Permette lo scorrimento ORIZZONTALE su schermi piccoli, 
           ma impedisce sempre quello verticale e l'impilamento */
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: auto;  /* Fondamentale: permette lo scroll laterale invece di impilare */
            overflow-y: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* Pavimento realistico: effetto legno/linoleum */
            background-color: #e8e4db;
            background-image: 
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(0deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 3vw 3vw;
            color: #333;
        }

        /* Effetto illuminazione dall'alto (Vignettatura) */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.15) 100%);
            pointer-events: none;
            z-index: 100;
        }

        /* Contenitore principale dell'applicazione */
        .app-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            padding: 2vh 4vw;
        }

        /* I 3 gruppi di banchi - FORZATI IN ORIZZONTALE */
        .classroom {
            display: flex;
            justify-content: center;
            align-items: center;
            /* Gap enorme e scalabile per separare i 3 blocchi */
            gap: clamp(40px, 12vw, 300px); 
            width: 100%;
            height: 100%;
            max-height: 80vh;
            /* Impedisce ai banchi di schiacciarsi su schermi piccoli, 
               forzando lo scroll orizzontale sul body */
            min-width: 900px; 
        }

        /* Ogni singolo gruppo (2 colonne) */
        .group {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Esattamente 2 colonne */
            /* Gap scalabile in base all'altezza e larghezza della LIM */
            gap: clamp(20px, 4vh, 60px) clamp(15px, 3vw, 50px); 
        }

        /* Contenitore del singolo banco + sedia */
        .desk-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: clamp(80px, 8vw, 180px); 
            position: relative;
            transition: transform 0.2s ease;
        }

        .desk-wrapper:hover {
            transform: translateY(-4px);
        }

        /* Piano del banco (Vista dall'alto) */
        .table {
            width: 100%;
            height: clamp(60px, 6vw, 120px);
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 1vh;
            box-shadow: 
                0 1.5vh 2vh -0.5vh rgba(0, 0, 0, 0.1),
                0 0.5vh 1vh -0.2vh rgba(0, 0, 0, 0.05),
                inset 0 -0.5vh 0 rgba(0,0,0,0.02);
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Numero grande al centro del banco */
        .desk-number {
            font-size: clamp(2rem, 3vw, 4rem); 
            font-weight: 700;
            color: #1f2937;
            line-height: 1;
            user-select: none;
            text-shadow: 0 0.2vh 0.4vh rgba(0,0,0,0.05);
        }

        /* Sedia (Vista dall'alto, infilata sotto il banco) */
        .chair {
            width: 60%;
            height: clamp(40px, 4vw, 80px);
            background: #374151;
            border-radius: 1vh;
            margin-top: -2vh; 
            z-index: 1;
            position: relative;
            box-shadow: 0 1vh 2vh rgba(0, 0, 0, 0.15);
        }

        /* Schienale della sedia */
        .chair::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 110%;
            height: 20%;
            background: #1f2937;
            border-radius: 0.5vh;
            box-shadow: 0 0.4vh 0.8vh rgba(0,0,0,0.2);
        }

        /* Stile del Pulsante */
        .controls {
            margin-top: auto; 
            padding-bottom: 2vh;
            z-index: 200;
        }

        button {
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 2vh 4vw; 
            font-size: clamp(1rem, 1.5vw, 2rem);
            font-weight: 600;
            letter-spacing: 0.1vw;
            cursor: pointer;
            box-shadow: 0 1vh 2vh rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
            min-width: 150px;
            text-align: center;
        }

        button:hover:not(:disabled) {
            background-color: #333333;
            transform: translateY(-0.5vh);
        }

        button:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Contenitore dei 3 gruppi: rimane SEMPRE orizzontale -->
        <div class="classroom">
            <div class="group" id="group-1"></div>
            <div class="group" id="group-2"></div>
            <div class="group" id="group-3"></div>
        </div>
        
        <div class="controls">
            <button id="shuffleBtn">Genera</button>
        </div>
    </div>

    <script>
        // Configurazione
        const TOTAL_SEATS = 24;
        const COOLDOWN_SECONDS = 5;
        const SEATS_PER_GROUP = 8; 

        // Stato
        let seats = Array.from({ length: TOTAL_SEATS }, (_, i) => i + 1);
        let isCooldown = false;

        // Elementi DOM
        const groupElements = [
            document.getElementById('group-1'),
            document.getElementById('group-2'),
            document.getElementById('group-3')
        ];
        const shuffleBtn = document.getElementById('shuffleBtn');

        // Funzione per mescolare l'array (Algoritmo Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Funzione per renderizzare i banchi realistici
        function renderGrid() {
            // Svuota tutti i gruppi
            groupElements.forEach(group => group.innerHTML = '');

            // Distribuisci i 24 numeri nei 3 gruppi
            for (let i = 0; i < TOTAL_SEATS; i++) {
                const deskWrapper = document.createElement('div');
                deskWrapper.classList.add('desk-wrapper');

                const table = document.createElement('div');
                table.classList.add('table');

                const deskNumber = document.createElement('div');
                deskNumber.classList.add('desk-number');
                deskNumber.textContent = seats[i];

                const chair = document.createElement('div');
                chair.classList.add('chair');

                // Assembla il banco
                table.appendChild(deskNumber);
                deskWrapper.appendChild(table);
                deskWrapper.appendChild(chair);

                // Calcola a quale gruppo appartiene (0, 1 o 2)
                const groupIndex = Math.floor(i / SEATS_PER_GROUP);
                groupElements[groupIndex].appendChild(deskWrapper);
            }
        }

        // Funzione di casualizzazione con timer
        function handleShuffle() {
            if (isCooldown) return;

            seats = shuffleArray(seats);
            renderGrid();

            isCooldown = true;
            let timeLeft = COOLDOWN_SECONDS;
            
            shuffleBtn.disabled = true;
            shuffleBtn.textContent = `${timeLeft}s`;

            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    shuffleBtn.textContent = `${timeLeft}s`;
                } else {
                    clearInterval(timer);
                    isCooldown = false;
                    shuffleBtn.disabled = false;
                    shuffleBtn.textContent = 'Genera';
                }
            }, 1000);
        }

        // Inizializzazione
        renderGrid();
        shuffleBtn.addEventListener('click', handleShuffle);
    </script>
</body>
</html>
