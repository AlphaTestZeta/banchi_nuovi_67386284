<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Posti</title>
    <style>
        /* Reset e Stili Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenitore principale che tiene insieme i 3 gruppi */
        .classroom {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 80px; /* Spazio ampio tra i tre gruppi */
            width: 100%;
            max-width: 1000px;
            margin-bottom: 50px;
        }

        /* Ogni singolo gruppo (2 colonne) */
        .group {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Esattamente 2 colonne */
            gap: 16px; /* Spazio tra i banchi dello stesso gruppo */
        }

        /* Stile dei Banchi */
        .desk {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80px; /* Larghezza fissa per mantenere la forma */
            height: 80px; /* Altezza fissa per mantenere la forma */
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1a1a;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            user-select: none;
        }

        .desk:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
        }

        /* Stile del Pulsante */
        .controls {
            display: flex;
            justify-content: center;
        }

        button {
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            user-select: none;
        }

        button:hover:not(:disabled) {
            background-color: #333333;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #cccccc;
            color: #888888;
            cursor: not-allowed;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .classroom {
                gap: 40px; /* Riduci lo spazio tra i gruppi su schermi più piccoli */
            }
            .desk {
                width: 70px;
                height: 70px;
                font-size: 1.25rem;
            }
        }

        @media (max-width: 600px) {
            .classroom {
                flex-direction: column; /* Impila i gruppi verticalmente su mobile */
                align-items: center;
                gap: 30px;
            }
        }
    </style>
</head>
<body>

    <!-- Contenitore dei 3 gruppi -->
    <div class="classroom">
        <div class="group" id="group-1"></div>
        <div class="group" id="group-2"></div>
        <div class="group" id="group-3"></div>
    </div>
    
    <div class="controls">
        <button id="shuffleBtn">Genera</button>
    </div>

    <script>
        // Configurazione
        const TOTAL_SEATS = 24;
        const COOLDOWN_SECONDS = 5;
        const SEATS_PER_GROUP = 8; // 24 posti / 3 gruppi = 8 posti per gruppo (2 colonne x 4 righe)

        // Stato
        let seats = Array.from({ length: TOTAL_SEATS }, (_, i) => i + 1);
        let isCooldown = false;

        // Elementi DOM
        const groupElements = [
            document.getElementById('group-1'),
            document.getElementById('group-2'),
            document.getElementById('group-3')
        ];
        const shuffleBtn = document.getElementById('shuffleBtn');

        // Funzione per mescolare l'array (Algoritmo Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Funzione per renderizzare i banchi nei 3 gruppi
        function renderGrid() {
            // Svuota tutti i gruppi
            groupElements.forEach(group => group.innerHTML = '');

            // Distribuisci i 24 numeri nei 3 gruppi
            for (let i = 0; i < TOTAL_SEATS; i++) {
                const desk = document.createElement('div');
                desk.classList.add('desk');
                desk.textContent = seats[i];
                
                // Calcola a quale gruppo appartiene questo banco (0, 1 o 2)
                const groupIndex = Math.floor(i / SEATS_PER_GROUP);
                groupElements[groupIndex].appendChild(desk);
            }
        }

        // Funzione di casualizzazione con timer
        function handleShuffle() {
            if (isCooldown) return;

            // Mescola e renderizza
            seats = shuffleArray(seats);
            renderGrid();

            // Avvia il cooldown
            isCooldown = true;
            let timeLeft = COOLDOWN_SECONDS;
            
            shuffleBtn.disabled = true;
            shuffleBtn.textContent = `${timeLeft}s`;

            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    shuffleBtn.textContent = `${timeLeft}s`;
                } else {
                    clearInterval(timer);
                    isCooldown = false;
                    shuffleBtn.disabled = false;
                    shuffleBtn.textContent = 'Genera';
                }
            }, 1000);
        }

        // Inizializzazione
        renderGrid();
        shuffleBtn.addEventListener('click', handleShuffle);
    </script>
</body>
</html>
